[package]
name = "apkaudio-bench"
version = "0.2.0"
edition = "2024"
description = "The instrument bench's shared vocabulary: the VISA device document, the declared-instrument sheets, the GUI trigger"

# serde_json AND NOTHING ELSE, on purpose (PLAN-3316.01 step 6.6).
#
# This is what the VISA plugin (which WRITES the bench) and the orchestrator's
# panel builder (which READS it) both have to agree on, pulled out of
# apkaudio-visa so the orchestrator can stop linking a whole instrument driver
# to parse one JSON object. No socket, no runtime, no python: a reader of the
# bench must not inherit what it takes to drive one.
[dependencies]
serde_json = "1"
